name: Validar protótipo
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar HTML e JavaScript
        run: node tests/smoke.mjs
      - name: Validar estrutura e invariantes de RLS
        run: node tests/rls-static.mjs
      - name: Validar módulo de autenticação Neon
        run: |
          node --check auth-preview/src/main.js
          node tests/auth-static.mjs
      - name: Validar API de desenvolvimento
        run: node tests/dev-api.mjs
      - name: Validar painel administrativo público
        run: |
          node --check admin/app.js
          node --check backend/public-site-worker.js
          node tests/admin-static.mjs
          node tests/admin-token.mjs
          node tests/admin-password.mjs
          node tests/admin-business.mjs
          node tests/admin-resilience.mjs
      - name: Instalar dependências do login de homologação
        working-directory: auth-preview
        run: npm install --no-audit --no-fund
      - name: Compilar login de homologação (não implantar)
        working-directory: auth-preview
        run: npm run build
