name: Validar protótipo
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar HTML e JavaScript
        run: node tests/smoke.mjs
      - name: Validar estrutura e invariantes de RLS
        run: node tests/rls-static.mjs
